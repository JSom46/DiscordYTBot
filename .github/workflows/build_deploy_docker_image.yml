name: Build and Deploy to OCI VM

on:
  pull_request:
    branches: [ "main" ]
    types:
      - closed

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to OCI VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            # Pull the latest image (ensure your GHCR package is public, or log in if private)
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Fetch the Discord secrets
            SECRET_BASE64=$(oci secrets secret-bundle get --secret-id ${{ secrets.OCI_SECRET_ID_DISCORD_APP_ID }} --auth instance_principal --raw-output --query "data.\"secret-bundle-content\".content")
            DISCORD_APP_ID=$(echo "$SECRET_BASE64" | base64 --decode)

            SECRET_BASE64=$(oci secrets secret-bundle get --secret-id ${{ secrets.OCI_SECRET_ID_DISCORD_BOT_TOKEN }} --auth instance_principal --raw-output --query "data.\"secret-bundle-content\".content")
            DISCORD_BOT_TOKEN=$(echo "$SECRET_BASE64" | base64 --decode)

            # Stop and remove the old container if it exists
            docker stop app-container || true
            docker rm app-container || true

            # Run the new container (adjust ports and environment variables as needed)
            docker run -d \
              --name app-container \
              -p 80:80 \
              -e TOKEN="$DISCORD_BOT_TOKEN" \
              -e APP_ID="$DISCORD_APP_ID" \
              --restart always \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Remove all stopped containers
            docker container prune -f
            
            # Remove untagged (dangling) images left behind by previous updates
            docker image prune -f